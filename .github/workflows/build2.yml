# .github/workflows/build.yml
name: Build Windows Executable with Nuitka

on:               # 推送 v1.0.0 等标签时自动触发
  workflow_dispatch:        # 手动触发，允许指定 Release 标签名
    inputs:
      tag:
        description: 'Release 标签名（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'       # 与之前保持一致

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 安装 Nuitka 及其 Windows 依赖
          pip install nuitka
          # 如需打包包含 GUI（--windows-disable-console），建议安装 zstandard 以加速压缩
          pip install zstandard

      - name: Build executable with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --windows-disable-console `
            --output-dir=dist `
            --output-filename=kmoji.exe `
            kmoji.py

      # （可选）压缩 exe 为 zip，便于下载
      - name: Compress artifact
        run: |
          Compress-Archive -Path dist/kmoji.exe -DestinationPath kmoji-windows.zip

      - name: Create Release and Upload Asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/kmoji.exe
            kmoji-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
