# .github/workflows/build.yml
name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'                # 推送 v1.0.0 等标签时自动触发
  workflow_dispatch:        # 手动触发，允许指定 Release 标签名
    inputs:
      tag:
        description: 'Release 标签名（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Package Application with PyInstaller
        uses: sayyid5416/pyinstaller@v1
        with:
          spec: 'kmoji.py'
          requirements: 'requirements.txt'
          options: --onefile, --name "kmoji", --windowed
          python_ver: '3.10'
          upload_exe_with_name: 'kmoji'

      - name: Create Release and Upload Asset
        # 仅当以下情况才执行：
        # 1. 手动触发（workflow_dispatch） 或
        # 2. 推送标签（push tags）
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时使用输入的 tag，推送标签时使用标签名
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/kmoji.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}